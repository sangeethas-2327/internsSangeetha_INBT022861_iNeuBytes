<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Management & Onboarding — CareNova Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header Shell -->
  <header class="site-header">
    <div class="container navbar">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/images/logo.svg" alt="CareNova Health Logo" width="240" height="60">
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="../index.html" class="nav-link">Home</a></li>
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="doctors.html" class="nav-link active">Doctors</a></li>
          <li><a href="patients.html" class="nav-link">Patients</a></li>
          <li><a href="departments.html" class="nav-link">Departments</a></li>
          <li><a href="appointments.html" class="nav-link">Appointments</a></li>
        </ul>
      </nav>
      <div id="navUserContainer"></div>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="hero-section" style="padding: 2rem 0;">
    <div class="container">
      <h1 class="hero-title" style="font-size: 1.8rem;">👨‍⚕️ Doctor Roster & Onboarding Console</h1>
      <p class="hero-subtitle" style="font-size: 0.95rem; margin-bottom: 0;">Onboard medical specialists, configure departments, and manage active status.</p>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="container" style="margin-top: 2rem; margin-bottom: 4rem;">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem;">
      
      <!-- Doctor Onboarding Form Card -->
      <div class="card" style="background: #fff; padding: 1.5rem; height: fit-content;">
        <h2 style="font-size: 1.25rem; color: var(--primary-color); margin-bottom: 1rem;">➕ Onboard New Doctor</h2>
        <div id="onboardAlert" class="form-alert" style="display: none; margin-bottom: 1rem;"></div>

        <form id="onboardDoctorForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" id="onboardFirstName" required placeholder="e.g. Ananya" />
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" id="onboardLastName" required placeholder="e.g. Rao" />
            </div>
          </div>

          <div class="form-group">
            <label>Professional Email *</label>
            <input type="email" id="onboardEmail" required placeholder="e.g. ananya.rao@carenova.health" />
          </div>

          <div class="form-group">
            <label>Account Password * (Min 6 chars)</label>
            <input type="password" id="onboardPassword" required placeholder="••••••••" minlength="6" />
          </div>

          <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" id="onboardPhone" required placeholder="+91 98765 00000" />
          </div>

          <div class="form-group">
            <label>Clinical Department *</label>
            <select id="onboardDepartment" required>
              <option value="">Loading departments...</option>
            </select>
          </div>

          <div class="form-group">
            <label>Qualifications *</label>
            <input type="text" id="onboardQualification" required placeholder="e.g. MD, DM (Cardiology)" />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
            <div class="form-group">
              <label>Experience (Years)</label>
              <input type="number" id="onboardExperience" min="0" value="5" />
            </div>
            <div class="form-group">
              <label>Fee (₹) *</label>
              <input type="number" id="onboardFee" min="100" value="600" required />
            </div>
          </div>

          <div class="form-group">
            <label>Professional Bio</label>
            <textarea id="onboardBio" rows="2" placeholder="Brief clinical summary and expertise..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Onboard Doctor Account</button>
        </form>
      </div>

      <!-- Doctor Roster List Card -->
      <div>
        <!-- Search & Filter Controls -->
        <div class="card" style="margin-bottom: 1rem; padding: 1rem; background: var(--bg-slate);">
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <input type="text" id="filterSearch" placeholder="🔍 Search by name, email, qualification..." style="flex: 1; min-width: 180px;" />
            <select id="filterDept" style="min-width: 150px;">
              <option value="">All Departments</option>
            </select>
            <select id="filterStatus" style="min-width: 120px;">
              <option value="">All Statuses</option>
              <option value="true">Active Only</option>
              <option value="false">Deactivated Only</option>
            </select>
          </div>
        </div>

        <div id="doctorsRosterList">
          <p style="color: var(--text-muted);">Loading doctor roster...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminApp.init('doctors');
    });
  </script>
</body>
</html>
