<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Management Directory — CareNova Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header Shell -->
  <header class="site-header">
    <div class="container navbar">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/images/logo.svg" alt="CareNova Health Logo" width="240" height="60">
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="../index.html" class="nav-link">Home</a></li>
          <li><a href="index.html" class="nav-link">Dashboard</a></li>
          <li><a href="doctors.html" class="nav-link">Doctors</a></li>
          <li><a href="patients.html" class="nav-link active">Patients</a></li>
          <li><a href="departments.html" class="nav-link">Departments</a></li>
          <li><a href="appointments.html" class="nav-link">Appointments</a></li>
        </ul>
      </nav>
      <div id="navUserContainer"></div>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="hero-section" style="padding: 2rem 0;">
    <div class="container">
      <h1 class="hero-title" style="font-size: 1.8rem;">👥 Patient Directory & Account Console</h1>
      <p class="hero-subtitle" style="font-size: 0.95rem; margin-bottom: 0;">View registered patient accounts, demographic details, and manage active session access.</p>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="container" style="margin-top: 2rem; margin-bottom: 4rem;">
    <!-- Search & Filter Controls -->
    <div class="card" style="margin-bottom: 1.5rem; padding: 1rem; background: var(--bg-slate);">
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <input type="text" id="patientSearch" placeholder="🔍 Search patient by name, email, or phone number..." style="flex: 1; min-width: 220px;" />
        <select id="patientStatusFilter" style="min-width: 150px;">
          <option value="">All Account Statuses</option>
          <option value="true">Active Patients Only</option>
          <option value="false">Deactivated Patients Only</option>
        </select>
      </div>
    </div>

    <!-- Patient Directory List -->
    <div id="patientsDirectoryList">
      <p style="color: var(--text-muted);">Loading patient directory...</p>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminApp.init('patients');
    });
  </script>
</body>
</html>
