<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authored Medical Records — CareNova Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header Shell -->
  <header class="site-header">
    <div class="container navbar">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/images/logo.svg" alt="CareNova Health Logo" width="240" height="60">
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="../index.html" class="nav-link">Home</a></li>
          <li><a href="index.html" class="nav-link">Workstation</a></li>
          <li><a href="appointments.html" class="nav-link">My Roster</a></li>
          <li><a href="records.html" class="nav-link active">Authored Records</a></li>
          <li><a href="profile.html" class="nav-link">My Schedule</a></li>
        </ul>
      </nav>
      <div id="navUserContainer"></div>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="hero-section" style="padding: 2rem 0;">
    <div class="container">
      <div class="phase-badge">📋 Clinical Medical Record History</div>
      <h1 class="hero-title" style="font-size: 1.8rem;" id="doctorHeaderTitle">Authored Clinical Medical Records</h1>
      <p class="hero-subtitle" style="font-size: 0.9rem; margin-bottom: 0;">Repository of diagnostic records and prescriptions authored for completed consultations</p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container" style="margin-top: 2rem; margin-bottom: 4rem;">
    <div id="authoredRecordsList">
      <p style="color: var(--text-muted);">Loading authored medical records...</p>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/doctor.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      DoctorApp.init('records');
    });
  </script>
</body>
</html>
