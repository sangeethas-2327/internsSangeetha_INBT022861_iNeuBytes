<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Profile & Schedule — CareNova Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header Shell -->
  <header class="site-header">
    <div class="container navbar">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/images/logo.svg" alt="CareNova Health Logo" width="240" height="60">
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="../index.html" class="nav-link">Home</a></li>
          <li><a href="index.html" class="nav-link">Workstation</a></li>
          <li><a href="appointments.html" class="nav-link">My Roster</a></li>
          <li><a href="records.html" class="nav-link">Authored Records</a></li>
          <li><a href="profile.html" class="nav-link active">My Schedule</a></li>
        </ul>
      </nav>
      <div id="navUserContainer"></div>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="hero-section" style="padding: 2rem 0;">
    <div class="container">
      <div class="phase-badge">⚙️ Schedule & Profile Configuration</div>
      <h1 class="hero-title" style="font-size: 1.8rem;" id="doctorHeaderTitle">Manage Clinical Profile & Availability</h1>
      <p class="hero-subtitle" style="font-size: 0.9rem; margin-bottom: 0;">Configure your medical credentials, consultation fee, working days, and time slots</p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container" style="margin-top: 2rem; margin-bottom: 4rem; max-width: 800px;">
    <div id="profileAlert" class="form-alert" style="display: none;"></div>

    <div class="card">
      <form id="doctorProfileForm">
        <div style="margin-bottom: 1.25rem;">
          <label style="font-weight: 600; display: block; margin-bottom: 0.35rem;">Medical Qualification</label>
          <input type="text" id="profQualification" class="form-control" placeholder="e.g. MD, FACC (Cardiology)" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.35rem;">Years of Experience</label>
            <input type="number" id="profExperience" class="form-control" min="0" max="60" required />
          </div>
          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.35rem;">Consultation Fee (₹ INR)</label>
            <input type="number" id="profFee" class="form-control" min="100" step="50" required />
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-weight: 600; display: block; margin-bottom: 0.35rem;">Working Days</label>
          <input type="text" id="profAvailableDays" class="form-control" placeholder="e.g. Mon,Tue,Wed,Thu,Fri" required />
          <small style="color: var(--text-muted);">Comma-separated list of working days</small>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Available Consultation Time Slots</label>
          <div id="slotsCheckGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.5rem;">
            <!-- Rendered by JS -->
          </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="font-weight: 600; display: block; margin-bottom: 0.35rem;">Professional Biography</label>
          <textarea id="profBio" class="form-control" rows="4" placeholder="Brief summary of clinical specialties, achievements, and patient care approach..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Profile & Schedule Updates</button>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/doctor.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      DoctorApp.init('profile');
    });
  </script>
</body>
</html>
